services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file: ./backend/.env
    ports:
      - "3600:3600"
    networks:
      - dostnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file: ./frontend/.env  
    ports:
      - "3601:3601"
    networks:
      - dostnet
    depends_on:
      - backend

networks:
  dostnet:
    driver: bridge